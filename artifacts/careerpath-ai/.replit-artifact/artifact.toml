kind = "web"
previewPath = "/"
title = "CareerPath AI"
description = "A personalized career roadmap app for students that turns their goals, current skills, and study time into trackable learning plans, portfolio projects, and job-readiness guidance."
version = "1.0.0"
id = "artifacts/careerpath-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21588

[services.development]
run = "pnpm --filter @workspace/careerpath-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/careerpath-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/careerpath-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21588"
BASE_PATH = "/"
